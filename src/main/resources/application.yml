spring:
  application:
    name: freemoa-crawler
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 서비스명 방식 접속: //호스트:포트/서비스명  (SID 방식은 호스트:포트:SID)
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: freemoa
    # 비밀번호는 코드에 쓰지 않고 환경변수로 주입한다 (IntelliJ 실행 설정 > Environment variables > DB_PASSWORD=...)
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 중요: 테이블은 db/*.sql로 직접 관리한다. JPA가 테이블을 만들거나 바꾸지 못하게 none.
      # (create, update로 두면 엔티티 모양대로 테이블을 바꿔버린다. 운영에선 절대 금지)
      ddl-auto: none
    # 화면 렌더링까지 DB 연결을 붙잡아 두는 기능. REST API에서는 필요 없고, 켜 두면 경고가 뜬다.
    open-in-view: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # DB 컬럼 PROJ_IDX -> 자바 필드 projIdx 자동 매핑
    map-underscore-to-camel-case: true
    # Oracle에 null을 바인딩할 때 '부적합한 열 유형: 1111' 에러 방지
    jdbc-type-for-null: 'NULL'

crawler:
  base-url: https://www.freemoa.net
  delay: 1s            # 페이지 사이 대기 (사이트 부담 줄이기)
  max-pages-limit: 30  # 한 번에 수집할 수 있는 최대 페이지 (1페이지 = 10건)
  full-max-pages: 1000 # 전체 수집(/api/crawl/all) 안전 상한. 마지막 페이지에서 보통 먼저 멈춘다
  incremental:           # 증분 배치 (새 공고만)
    enabled: true
    cron: "0 0 9-18 * * MON-FRI"   # 초 분 시 일 월 요일 -> 평일 9~18시 매시 정각 (테스트할 땐 "0 */10 * * * *" = 10분마다)
    max-pages: 10                  # 한 번에 최대 10페이지
    stop-after-idle-pages: 2       # 새 공고 없는 페이지가 2번 연속이면 멈춤

nexacro:
  # 넥사크로 화면이 뜨는 주소. 브라우저 주소창에 보이는 값과 정확히 같아야 한다 (localhost와 127.0.0.1은 다른 출처)
  allowed-origins: http://localhost:4098,http://127.0.0.1:4098

logging:
  level:
    # 실행되는 SQL을 로그로 확인 (mapper 패키지 DEBUG)
    com.lhk.freemoa: DEBUG
    # JPA가 만든 SQL과 바인딩 값 (MyBatis 로그와 비교해 보기)
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
