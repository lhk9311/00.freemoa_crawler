spring:
  application:
    name: freemoa-crawler
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 서비스명 방식 접속: //호스트:포트/서비스명  (SID 방식은 호스트:포트:SID)
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: freemoa
    # 비밀번호는 코드에 쓰지 않고 환경변수로 주입한다 (IntelliJ 실행 설정 > Environment variables > DB_PASSWORD=...)
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    # DB 컬럼 PROJ_IDX -> 자바 필드 projIdx 자동 매핑
    map-underscore-to-camel-case: true
    # Oracle에 null을 바인딩할 때 '부적합한 열 유형: 1111' 에러 방지
    jdbc-type-for-null: 'NULL'

crawler:
  base-url: https://www.freemoa.net
  delay: 1s            # 페이지 사이 대기 (사이트 부담 줄이기)
  max-pages-limit: 30  # 한 번에 수집할 수 있는 최대 페이지 (1페이지 = 10건)

nexacro:
  # 넥사크로 화면이 뜨는 주소. 브라우저 주소창에 보이는 값과 정확히 같아야 한다 (localhost와 127.0.0.1은 다른 출처)
  allowed-origins: http://localhost:4098,http://127.0.0.1:4098

logging:
  level:
    # 실행되는 SQL을 로그로 확인 (mapper 패키지 DEBUG)
    com.lhk.freemoa: DEBUG
